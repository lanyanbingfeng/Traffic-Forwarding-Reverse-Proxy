# FlClash/Mihomo 直连服务端模板。
# 将下面 4 个 CHANGE_ME 值替换为安装脚本输出的服务器 IP、用户名、密码和证书指纹。
# mixed-port 固定为 FlClash 默认的 7890，不需要运行 tunnel-client.exe。

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info

proxies:
  - name: "campus-tunnel-53"
    type: socks5
    server: "CHANGE_ME_SERVER_IP"
    port: 53
    username: "CHANGE_ME_USERNAME"
    password: "CHANGE_ME_PASSWORD"
    tls: true
    sni: "tunnel.local"
    fingerprint: "CHANGE_ME_CERT_SHA256"
    udp: false
    ip-version: ipv4

proxy-groups:
  - name: "Proxy"
    type: select
    proxies:
      - "campus-tunnel-53"

rules:
  - MATCH,Proxy
